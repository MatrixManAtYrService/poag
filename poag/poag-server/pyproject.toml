[project]
name = "poag-server"
version = "0.1.0"
description = "POAG server with session management and business logic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.5",
    "xdg-base-dirs>=6.0.2",
    "pact-python>=3.2.1",
    # poag-api-server is provided via Nix PYTHONPATH (not in PyPI)
    # Transitive deps from poag-api-server (from poag-api/server-pyproject.toml)
    "starlette>=0.49.0",
    "python-multipart>=0.0.18",
    "pyyaml>=5.4.1",
    "aiofiles>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
