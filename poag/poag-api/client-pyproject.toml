[project]
name = "poag-api-client"
version = "0.1.0"
description = "POAG API Client (Generated)"
requires-python = ">=3.8"
dependencies = [
    "urllib3>=1.25.3,<3.0.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.0.0",
    "certifi>=2023.7.22",
    "six>=1.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
