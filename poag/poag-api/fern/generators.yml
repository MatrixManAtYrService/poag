api:
  specs:
    - openapi: ../poag.json
      settings:
        title-as-schema-name: true
        inline-path-parameters: true

default-group: all

groups:
  python-client:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.45.9
        output:
          location: local-file-system
          path: ../generated/client-py
        config:
          client_class_name: PoagClient
          pydantic_config:
            version: v2
          timeout_in_seconds: 60

  fastapi-server:
    generators:
      - name: fernapi/fern-fastapi-server
        version: 0.0.33
        output:
          location: local-file-system
          path: ../generated/server
        config:
          pydantic_config:
            version: v2

  # Alias to generate both
  all:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.45.9
        output:
          location: local-file-system
          path: ../generated/client-py
        config:
          client_class_name: PoagClient
          pydantic_config:
            version: v2
          timeout_in_seconds: 60
      - name: fernapi/fern-fastapi-server
        version: 0.0.33
        output:
          location: local-file-system
          path: ../generated/server
        config:
          pydantic_config:
            version: v2
