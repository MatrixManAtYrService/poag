[project]
name = "poag-api-server"
version = "0.1.0"
description = "POAG API Server (Generated)"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.120.0",
    "pydantic>=2.0",
    "uvicorn>=0.13.4",
    "starlette>=0.49.0",
    "python-multipart>=0.0.18",
    "pyyaml>=5.4.1",
    "aiofiles>=23.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
