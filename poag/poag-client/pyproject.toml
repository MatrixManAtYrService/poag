[project]
name = "poag-client"
version = "0.1.0"
description = "POAG client library with session management"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pact-python>=3.2.1",
    "pydantic>=2.10.5",
    "poag-api-client>=0.1.0",
]

[tool.uv.sources]
poag-api-client = { path = "./generated/poag-api-client" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
