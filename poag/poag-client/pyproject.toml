[project]
name = "poag-client"
version = "0.1.0"
description = "POAG client library with session management"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pact-python>=3.2.1",
    "pydantic>=2.10.5",
    # poag-api-client is provided via Nix overlay (not in PyPI)
    # Transitive deps from poag-api-client (from poag-api/client-pyproject.toml)
    "urllib3>=1.25.3,<3.0.0",
    "python-dateutil>=2.8.2",
    "certifi>=2023.7.22",
    "six>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
